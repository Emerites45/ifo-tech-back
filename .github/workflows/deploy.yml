name: CI/CD Pipeline Backend - IFO-Horizon Tech

on:
  push:
    branches: [ master ] # Déclenchement sur push et merge sur la branche master

jobs:
  # -------------------------------------------------------------
  # 1. Build & Push de l'image Docker sur GHCR
  # -------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🔍 [1/5] Récupération du code source
        uses: actions/checkout@v4

      - name: 🏷️ [2/5] Génération du nom d'image Docker
        run: |
          IMAGE=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/$IMAGE" >> $GITHUB_ENV
          echo "=== Nom d'image généré : ghcr.io/$IMAGE ==="

      - name: 🔑 [3/5] Connexion à GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ [4/5] Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🚀 [5/5] Build et Push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # 2. Déploiement Verbose sur le VPS via SSH
  # -------------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 🖥️ Connexion SSH et déploiement détaillé sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          debug: true # Affiche les détails du handshake SSH et des logs de connexion
          script: |
            # Activation du mode verbeux (affiche chaque commande exécutée)
            set -ex

            echo "================================================"
            echo "1. Vérification de l'environnement sur le VPS"
            echo "================================================"
            echo "Utilisateur courant : $(whoami)"
            echo "Dossier courant : $(pwd)"

            TARGET_DIR="/root/apps/ifo-horizon-tech-backend"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "❌ ERREUR CRITIQUE : Le dossier $TARGET_DIR n'existe pas sur le VPS !"
              exit 1
            fi

            cd "$TARGET_DIR"
            echo "📂 Navigation réussie vers : $(pwd)"

            if [ ! -f "docker-compose.yml" ] && [ ! -f "docker-compose.yaml" ]; then
              echo "❌ ERREUR CRITIQUE : Aucun fichier docker-compose.yml trouvé dans $(pwd) !"
              ls -la
              exit 1
            fi

            echo "================================================"
            echo "2. Authentification auprès du registre Docker (GHCR)"
            echo "================================================"
            if [ -z "${{ secrets.GHCR_PAT }}" ]; then
              echo "❌ ERREUR CRITIQUE : Le secret GHCR_PAT est vide ou non défini dans GitHub !"
              exit 1
            fi

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "✅ Authentification GHCR réussie."

            echo "================================================"
            echo "3. Téléchargement et mise à jour des conteneurs"
            echo "================================================"
            echo "--> Pull de l'image backend..."
            docker compose pull backend

            echo "--> Redémarrage des services..."
            docker compose up -d --remove-orphans

            echo "================================================"
            echo "4. Nettoyage et état final"
            echo "================================================"
            docker image prune -f
            echo "--> Statut des conteneurs en cours d'exécution :"
            docker compose ps
            echo "✅ Déploiement terminé avec succès !"