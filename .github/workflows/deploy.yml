name: CI/CD Pipeline Backend - IFO-Horizon Tech

on:
  push:
    branches: [ master ] # Déclenchement sur push et merge sur la branche master

jobs:
  # -------------------------------------------------------------
  # 1. Build & Push de l'image Docker sur GHCR
  # -------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Générer le nom d'image en minuscules
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # 2. Déploiement sur le VPS
  # -------------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Connexion SSH et déploiement
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e

            # Authentification auprès du registre GitHub (avec le mot de passe du token GitHub ou GHCR_PAT)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Navigation vers le dossier d'application sous l'utilisateur root
            cd /root/apps/ifo-horizon-tech-backend

            # Téléchargement de la nouvelle image du backend
            docker compose pull backend

            # Redémarrage du backend (PostgreSQL et Redis restent actifs sans interruption)
            docker compose up -d --remove-orphans

            # Nettoyage des anciennes images inutilisées
            docker image prune -f