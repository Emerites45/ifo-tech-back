name: CI/CD Pipeline Backend - IFO-Horizon Tech

on:
  push:
    branches: [ master ] # Déclenchement automatique sur la branche master

jobs:
  # -------------------------------------------------------------
  # 1. Build & Push de l'image Docker sur GHCR
  # -------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🔍 Récupération du code source
        uses: actions/checkout@v4

      - name: 🏷️ Génération du nom d'image Docker
        run: |
          IMAGE=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/$IMAGE" >> $GITHUB_ENV

      - name: 🔑 Connexion à GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🚀 Build et Push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # 2. Déploiement sur le VPS via SSH
  # -------------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 🖥️ Connexion SSH et déploiement détaillé sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }} # <--- CORRIGÉ : Utilise le secret VPS_USER
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          debug: true 
          script: |
            # Arrêter le script si une commande échoue
            set -e

            echo "================================================"
            echo "1. VERIFICATION DE L'ENVIRONNEMENT"
            echo "================================================"
            echo "Utilisateur courant sur VPS : $(whoami)"
            
            # NOTE : Si VPS_USER n'est pas "root", assurez-vous que cet utilisateur 
            # a les droits d'accès au dossier /root/apps/ ou changez le chemin.
            TARGET_DIR="/root/apps/ifo-horizon-tech-backend"
            
            if [ ! -d "$TARGET_DIR" ]; then
              echo "❌ ERREUR : Le dossier cible $TARGET_DIR n'existe pas."
              exit 1
            fi

            cd "$TARGET_DIR"

            echo "================================================"
            echo "2. AUTHENTIFICATION GHCR"
            echo "================================================"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "================================================"
            echo "3. MISE À JOUR ET REDÉMARRAGE"
            echo "================================================"
            echo "--> Pull de l'image backend..."
            docker compose pull backend

            echo "--> Relancement des services..."
            docker compose up -d --remove-orphans

            echo "================================================"
            echo "4. NETTOYAGE ET ETAT FINAL"
            echo "================================================"
            docker image prune -f
            docker compose ps

            echo "🚀 DEPLOIEMENT TERMINE AVEC SUCCÈS !"