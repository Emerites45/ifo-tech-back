name: CI/CD Pipeline Backend - IFO-Horizon Tech

on:
  push:
    branches: [ master ] # Déclenchement sur push sur la branche master

jobs:
  # -------------------------------------------------------------
  # 1. Build & Push de l'image Docker sur GHCR
  # -------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🔍 [1/5] Récupération du code source
        uses: actions/checkout@v4

      - name: 🏷️ [2/5] Génération du nom d'image Docker
        run: |
          # Conversion du nom du dépôt en minuscules pour Docker
          IMAGE=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/$IMAGE" >> $GITHUB_ENV
          echo "=== Nom d'image généré : ghcr.io/$IMAGE ==="

      - name: 🔑 [3/5] Connexion à GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ [4/5] Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🚀 [5/5] Build et Push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # 2. Déploiement sur le VPS via SSH
  # -------------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 🖥️ Connexion SSH et déploiement sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          debug: true # Gardé à true pour diagnostiquer les erreurs de clé
          script: |
            # Activation du mode "exit on error" et affichage des commandes
            set -ex

            echo "================================================"
            echo "1. Vérification de l'environnement"
            echo "================================================"
            echo "Utilisateur : $(whoami)"
            
            TARGET_DIR="/root/apps/ifo-horizon-tech-backend"
            
            if [ ! -d "$TARGET_DIR" ]; then
              echo "❌ Erreur : Dossier $TARGET_DIR introuvable."
              exit 1
            fi

            cd "$TARGET_DIR"

            if [ ! -f "docker-compose.yml" ] && [ ! -f "docker-compose.yaml" ]; then
              echo "❌ Erreur : Aucun docker-compose.yml trouvé."
              ls -la
              exit 1
            fi

            echo "================================================"
            echo "2. Authentification GHCR"
            echo "================================================"
            # Utilisation de la variable de l'acteur GitHub passée dynamiquement
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "================================================"
            echo "3. Mise à jour des images et redémarrage"
            echo "================================================"
            # On force le pull de la dernière image
            docker compose pull backend
            
            # Relancement des conteneurs
            docker compose up -d --remove-orphans

            echo "================================================"
            echo "4. Nettoyage"
            echo "================================================"
            docker image prune -f
            
            echo "--> État des services :"
            docker compose ps
            echo "✅ Déploiement réussi !"